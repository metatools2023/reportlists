# 每日增量抓取 + change-only 部署
# schedule: 每日 08:00 UTC（北京 16:00，收盘后研报基本入库）
# push: 站点代码/抓取脚本变更时立即重跑并部署（数据提交不触发，防循环）
name: Update daily

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "site/**"
      - "!site/data/**"
      - "scripts/**"
      - ".github/workflows/update-daily.yml"

permissions:
  contents: write

concurrency:
  group: update-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps (build_stats 热词提取)
        run: pip install jieba

      - name: Fetch yesterday's reports
        run: python3 scripts/fetch_reports.py --repo-root .

      - name: Build index
        run: python3 scripts/build_index.py --repo-root .

      - name: Build stats
        run: python3 scripts/build_stats.py --repo-root .

      - name: Commit data if changed
        id: commit
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard -- site/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "data: daily update ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 pages deploy site --project-name=reportlists --commit-dirty=true
