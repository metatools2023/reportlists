# 当前仅保留手动触发，避免骨架阶段自动运行失败
name: Update daily

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch yesterday's reports
        run: python3 scripts/fetch_reports.py --repo-root .

